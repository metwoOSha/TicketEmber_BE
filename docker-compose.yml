services:
    postgres:
        image: postgres:16
        container_name: ticketember-pg
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ticketember
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: ticketember-redis
        ports:
            - '6379:6379'
        volumes:
            - redisdata:/data

volumes:
    pgdata:
    redisdata:
